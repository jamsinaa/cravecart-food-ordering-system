<!DOCTYPE html>
<html>

<head>
    <title>Order Success</title>

    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .success-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            width: 350px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .success-icon {
            font-size: 60px;
        }

        h1 {
            margin-top: 10px;
            color: #333;
        }

        p {
            color: #666;
        }

        .home-btn {
            margin-top: 20px;
            padding: 10px 20px;
            border: none;
            background: #667eea;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .home-btn:hover {
            background: #5a67d8;
        }
    </style>

</head>

<body>

    <div class="success-card">

        <div class="success-icon">✅</div>

        <h1>Order Placed!</h1>

        <p>Your delicious food is on the way 🍔</p>

        <a href="/">
            <button class="home-btn">Back to Home</button>
        </a>

    </div>

</body>

</html>
